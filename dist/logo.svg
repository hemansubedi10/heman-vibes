<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Core Ambient Neon Bloom -->
    <filter id="liquid-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glass Elevation Drop Shadow -->
    <filter id="capsule-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00d2ff" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#818cf8" flood-opacity="0.4" />
    </filter>

    <!-- Chrome Specular Glow -->
    <filter id="specular-sparkle" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Liquid Fluid Gradients -->
    <linearGradient id="liquid-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="28%" stop-color="#00d2ff" />
      <stop offset="62%" stop-color="#4f46e5" />
      <stop offset="85%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="liquid-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Background Space Obsidian -->
    <radialGradient id="space-crystal" cx="30%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#182442" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#0e172a" stop-opacity="0.98" />
      <stop offset="85%" stop-color="#070a14" stop-opacity="1" />
      <stop offset="100%" stop-color="#03050a" stop-opacity="1" />
    </radialGradient>

    <!-- Refractive Glass Rim -->
    <linearGradient id="glass-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Inner Frosted Sheen -->
    <linearGradient id="inner-frost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="v-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Ambient Fluid Glow Behind Vessel -->
  <circle cx="128" cy="128" r="90" fill="url(#liquid-core)" opacity="0.35" filter="url(#liquid-bloom)" />

  <!-- Outer Liquid Glass Capsule (Squircle) -->
  <rect x="18" y="18" width="220" height="220" rx="58" 
        fill="url(#space-crystal)" 
        stroke="url(#glass-rim)" 
        stroke-width="2.5" 
        filter="url(#capsule-shadow)" />

  <!-- Inner Refractive Frosted Layer -->
  <rect x="21" y="21" width="214" height="214" rx="55" 
        fill="url(#inner-frost)" />

  <!-- Liquid Waves In Glass Chamber (Meniscus Pool) -->
  <path d="M 20,154 C 65,134 105,178 165,146 C 198,128 218,142 236,154 L 236,180 C 236,210 208,236 178,236 L 78,236 C 44,236 20,210 20,180 Z" 
        fill="url(#liquid-core)" opacity="0.22" />

  <path d="M 20,168 C 80,152 120,186 180,165 C 205,155 224,166 236,174 L 236,180 C 236,210 208,236 178,236 L 78,236 C 44,236 20,210 20,180 Z" 
        fill="#00f5ff" opacity="0.15" />

  <!-- Specular Lens Glint Arc at Top of Glass -->
  <path d="M 44,36 C 85,24 171,24 212,36 C 220,38 196,62 128,62 C 60,62 36,38 44,36 Z" 
        fill="#ffffff" opacity="0.22" />

  <!-- ==================== HV MONOGRAM ==================== -->
  <g filter="url(#liquid-bloom)">
    
    <!-- === LETTER H === -->
    <!-- Left Pillar of H -->
    <path d="M 44,64 C 44,58 48,54 54,54 L 64,54 C 70,54 74,58 74,64 L 74,192 C 74,198 70,202 64,202 L 54,202 C 48,202 44,198 44,192 Z" 
          fill="url(#liquid-core)" stroke="url(#liquid-sheen)" stroke-width="1.5" />
    
    <!-- Specular Ridge on Left Pillar -->
    <path d="M 49,62 L 49,194" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />

    <!-- Right Pillar of H -->
    <path d="M 94,64 C 94,58 98,54 104,54 L 114,54 C 120,54 124,58 124,64 L 124,192 C 124,198 120,202 114,202 L 104,202 C 98,202 94,198 94,192 Z" 
          fill="url(#liquid-core)" stroke="url(#liquid-sheen)" stroke-width="1.5" />
    
    <!-- Specular Ridge on Right Pillar -->
    <path d="M 99,62 L 99,194" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.65" />

    <!-- Crossbar of H with Glass Prismatic Bevel -->
    <path d="M 72,117 L 96,117 C 101,117 105,121 105,126 L 105,132 C 105,137 101,141 96,141 L 72,141 C 67,141 63,137 63,132 L 63,126 C 63,121 67,117 72,117 Z" 
          fill="url(#liquid-core)" stroke="url(#liquid-sheen)" stroke-width="1.2" />

    <!-- === LETTER V (Aerodynamic Precision Glass Wings) === -->
    <path d="M 142,56 
             L 166,56 
             L 178,146 
             L 190,56 
             L 214,56 
             L 188,193 
             C 185,202 171,202 168,193 
             Z" 
          fill="url(#v-gradient)" 
          stroke="url(#liquid-sheen)" 
          stroke-width="1.5" />

    <!-- Left Wing Specular Ridge on V -->
    <path d="M 148,60 L 175,178" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />

    <!-- Right Wing Specular Ridge on V -->
    <path d="M 208,60 L 181,178" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  </g>

  <!-- Central Dynamic Prism Sparkle -->
  <g transform="translate(133, 128)" filter="url(#specular-sparkle)">
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="2.5" fill="#00f5ff" />
  </g>

  <!-- Secondary Star Glint on Top Right of V -->
  <g transform="translate(210, 56)" filter="url(#specular-sparkle)">
    <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Accent Star Glint on Top Left of H -->
  <g transform="translate(48, 56)" filter="url(#specular-sparkle)">
    <path d="M 0,-5 Q 0,0 5,0 Q 0,0 0,5 Q 0,0 -5,0 Q 0,0 0,-5 Z" fill="#ffffff" opacity="0.8" />
  </g>
</svg>