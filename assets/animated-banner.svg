<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <!-- Animated Shimmering Aurora Gradients -->
    <linearGradient id="aurora-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#7000ff;#ff007a;#00f5ff" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#00f5ff;#7000ff;#38bdf8" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ff007a;#00f5ff;#6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#38bdf8;#7000ff;#a855f7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="banner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glass Specular Border -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#00f5ff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="mesh-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141f38" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05070e" />
    </radialGradient>
  </defs>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes glint {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .floating-logo {
      animation: float 6s ease-in-out infinite;
      transform-origin: 160px 180px;
    }
    .pulsing-orb {
      animation: pulse 8s ease-in-out infinite;
      transform-origin: 50% 50%;
    }
    .shimmer-star {
      animation: glint 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="960" height="360" rx="24" fill="url(#mesh-bg)" stroke="url(#glass-border)" stroke-width="2" />

  <!-- Animated Ambient Light Orbs -->
  <circle class="pulsing-orb" cx="220" cy="180" r="140" fill="url(#aurora-anim)" opacity="0.35" filter="url(#banner-glow)" />
  <circle class="pulsing-orb" cx="740" cy="120" r="110" fill="#00d2ff" opacity="0.2" filter="url(#banner-glow)" style="animation-delay: -3s;" />
  <circle class="pulsing-orb" cx="820" cy="260" r="90" fill="#a855f7" opacity="0.25" filter="url(#banner-glow)" style="animation-delay: -5s;" />

  <!-- Frosted Glass Decorative Wave in Background -->
  <path d="M 0,280 Q 240,230 480,290 T 960,260 L 960,360 L 0,360 Z" fill="rgba(255,255,255,0.02)" />
  <path d="M 0,300 Q 300,260 600,310 T 960,290 L 960,360 L 0,360 Z" fill="rgba(0,210,255,0.04)" />

  <!-- Glass Specular Highlight Arc -->
  <path d="M 40,2 C 260,2 700,2 920,2 C 940,2 920,30 840,30 C 580,30 380,30 120,30 C 40,30 20,2 40,2 Z" fill="#ffffff" opacity="0.12" />

  <!-- ==================== LEFT: FLOATING HV MONOGRAM EMBLEM ==================== -->
  <g class="floating-logo" transform="translate(60, 55)">
    <!-- Squircle Glass Capsule -->
    <rect x="15" y="15" width="220" height="220" rx="56" fill="#090e1c" stroke="url(#glass-border)" stroke-width="2.5" filter="url(#banner-glow)" />
    <!-- Inner Sheen -->
    <rect x="19" y="19" width="212" height="212" rx="52" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- HV Letterforms -->
    <g filter="url(#neon-glow)">
      <!-- Left Bar of H -->
      <path d="M 46,62 C 46,56 50,52 56,52 L 66,52 C 72,52 76,56 76,62 L 76,188 C 76,194 72,198 66,198 L 56,198 C 50,198 46,194 46,188 Z" fill="url(#aurora-anim)" />
      <!-- Right Bar of H -->
      <path d="M 94,62 C 94,56 98,52 104,52 L 114,52 C 120,52 124,56 124,62 L 124,188 C 124,194 120,198 114,198 L 104,198 C 98,198 94,194 94,188 Z" fill="url(#aurora-anim)" />
      <!-- Crossbar of H -->
      <path d="M 74,116 L 96,116 C 101,116 105,120 105,125 L 105,131 C 105,136 101,140 96,140 L 74,140 C 69,140 65,136 65,131 L 65,125 C 65,120 69,116 74,116 Z" fill="url(#aurora-anim)" />
      <!-- Letter V Wings -->
      <path d="M 142,54 L 166,54 L 178,144 L 190,54 L 214,54 L 188,190 C 185,199 171,199 168,190 Z" fill="url(#aurora-anim)" />
    </g>

    <!-- Star Glints -->
    <g class="shimmer-star" transform="translate(133, 126)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="2" fill="#00f5ff" />
    </g>
  </g>

  <!-- ==================== RIGHT: TYPOGRAPHY & EDITION BADGES ==================== -->
  <g transform="translate(340, 75)">
    <!-- Category Tag Pill -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="rgba(0, 210, 255, 0.12)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#00d2ff" />
    <text x="30" y="20" fill="#00d2ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">NEXT-GEN LIQUID GLASS</text>

    <!-- Master Title: HEMAN VIBES -->
    <text x="0" y="92" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" letter-spacing="4" filter="url(#neon-glow)">HEMAN VIBES</text>

    <!-- Subtitle Description -->
    <text x="0" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500">
      Universal Media Streaming Arena • Zero Lag • Ad-Free
    </text>

    <!-- Dual Edition Platform Badges -->
    <g transform="translate(0, 162)">
      <!-- PC Badge -->
      <g>
        <rect x="0" y="0" width="220" height="48" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.2" />
        <rect x="8" y="8" width="32" height="32" rx="8" fill="rgba(0, 210, 255, 0.18)" />
        <text x="18" y="29" fill="#00d2ff" font-family="system-ui" font-size="16">🖥️</text>
        <text x="48" y="24" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">PC Edition</text>
        <text x="48" y="38" fill="#94a3b8" font-family="system-ui" font-size="11">Windows • macOS • Linux</text>
      </g>

      <!-- TV Badge -->
      <g transform="translate(236, 0)">
        <rect x="0" y="0" width="220" height="48" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(0, 210, 255, 0.35)" stroke-width="1.2" />
        <rect x="8" y="8" width="32" height="32" rx="8" fill="rgba(129, 140, 248, 0.2)" />
        <text x="18" y="29" fill="#818cf8" font-family="system-ui" font-size="16">📺</text>
        <text x="48" y="24" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">TV Edition</text>
        <text x="48" y="38" fill="#38bdf8" font-family="system-ui" font-size="11">Android TV • Firestick • Tizen</text>
      </g>
    </g>
  </g>
</svg>
