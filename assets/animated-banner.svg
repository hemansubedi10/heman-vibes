<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Shimmering Aurora Gradients -->
    <linearGradient id="aurora-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#7000ff;#ff007a;#00f5ff" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#00f5ff;#7000ff;#38bdf8" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ff007a;#00f5ff;#6366f1" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#7000ff;#ec4899" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="banner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="button-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glass Specular Border -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#00f5ff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>

    <!-- Button Hover / Active Gradients -->
    <linearGradient id="btn-pc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="btn-tv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="mesh-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141f38" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05070e" />
    </radialGradient>
  </defs>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes glint {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes bounce-down {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }
    .floating-logo {
      animation: float 6s ease-in-out infinite;
      transform-origin: 160px 190px;
    }
    .pulsing-orb {
      animation: pulse 8s ease-in-out infinite;
      transform-origin: 50% 50%;
    }
    .shimmer-star {
      animation: glint 2.5s ease-in-out infinite;
    }
    .download-arrow {
      animation: bounce-down 1.6s ease-in-out infinite;
    }
    .clickable-card {
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    .clickable-card:hover {
      transform: translateY(-3px) scale(1.02);
      filter: drop-shadow(0 0 16px rgba(0, 210, 255, 0.6));
    }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="960" height="380" rx="24" fill="url(#mesh-bg)" stroke="url(#glass-border)" stroke-width="2" />

  <!-- Animated Ambient Light Orbs -->
  <circle class="pulsing-orb" cx="220" cy="190" r="145" fill="url(#aurora-anim)" opacity="0.35" filter="url(#banner-glow)" />
  <circle class="pulsing-orb" cx="740" cy="130" r="115" fill="#00d2ff" opacity="0.2" filter="url(#banner-glow)" style="animation-delay: -3s;" />
  <circle class="pulsing-orb" cx="830" cy="280" r="95" fill="#a855f7" opacity="0.25" filter="url(#banner-glow)" style="animation-delay: -5s;" />

  <!-- Frosted Glass Wave Lines -->
  <path d="M 0,290 Q 240,240 480,300 T 960,270 L 960,380 L 0,380 Z" fill="rgba(255,255,255,0.02)" />
  <path d="M 0,310 Q 300,270 600,320 T 960,300 L 960,380 L 0,380 Z" fill="rgba(0,210,255,0.04)" />

  <!-- Glass Specular Highlight Arc -->
  <path d="M 40,2 C 260,2 700,2 920,2 C 940,2 920,30 840,30 C 580,30 380,30 120,30 C 40,30 20,2 40,2 Z" fill="#ffffff" opacity="0.14" />

  <!-- ==================== LEFT: FLOATING HV MONOGRAM EMBLEM ==================== -->
  <g class="floating-logo" transform="translate(60, 65)">
    <!-- Squircle Glass Capsule -->
    <rect x="15" y="15" width="220" height="220" rx="56" fill="#090e1c" stroke="url(#glass-border)" stroke-width="2.5" filter="url(#banner-glow)" />
    <!-- Inner Sheen -->
    <rect x="19" y="19" width="212" height="212" rx="52" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- HV Letterforms -->
    <g filter="url(#neon-glow)">
      <!-- Left Bar of H -->
      <path d="M 46,62 C 46,56 50,52 56,52 L 66,52 C 72,52 76,56 76,62 L 76,188 C 76,194 72,198 66,198 L 56,198 C 50,198 46,194 46,188 Z" fill="url(#aurora-anim)" />
      <!-- Right Bar of H -->
      <path d="M 94,62 C 94,56 98,52 104,52 L 114,52 C 120,52 124,56 124,62 L 124,188 C 124,194 120,198 114,198 L 104,198 C 98,198 94,194 94,188 Z" fill="url(#aurora-anim)" />
      <!-- Crossbar of H -->
      <path d="M 74,116 L 96,116 C 101,116 105,120 105,125 L 105,131 C 105,136 101,140 96,140 L 74,140 C 69,140 65,136 65,131 L 65,125 C 65,120 69,116 74,116 Z" fill="url(#aurora-anim)" />
      <!-- Letter V Wings -->
      <path d="M 142,54 L 166,54 L 178,144 L 190,54 L 214,54 L 188,190 C 185,199 171,199 168,190 Z" fill="url(#aurora-anim)" />
    </g>

    <!-- Star Glints -->
    <g class="shimmer-star" transform="translate(133, 126)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="2" fill="#00f5ff" />
    </g>
  </g>

  <!-- ==================== RIGHT: TYPOGRAPHY & CLICKABLE DOWNLOAD BUTTONS ==================== -->
  <g transform="translate(340, 60)">
    <!-- Category Tag Pill -->
    <rect x="0" y="0" width="300" height="28" rx="14" fill="rgba(0, 210, 255, 0.12)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4" fill="#00d2ff" />
    <text x="26" y="19" fill="#00d2ff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">⚡ v1.0.0 LIQUID GLASS RELEASE</text>

    <!-- Master Title: HEMAN VIBES -->
    <text x="0" y="86" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="3" filter="url(#neon-glow)">HEMAN VIBES</text>

    <!-- Subtitle Description -->
    <text x="0" y="122" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">
      Universal Media Streaming Arena • Zero Lag • Ad-Free
    </text>

    <!-- ==================== CLICKABLE DOWNLOAD CARDS ==================== -->
    <g transform="translate(0, 150)">
      
      <!-- 🖥️ CLICKABLE PC DOWNLOAD CARD -->
      <a xlink:href="https://github.com/hemansubedi10/heman-vibes/releases/download/v1.0.0/HeMan-Vibes-Windows-v1.0.0.zip" target="_blank" class="clickable-card">
        <g>
          <!-- Card Body -->
          <rect x="0" y="0" width="265" height="74" rx="16" fill="url(#btn-pc-grad)" stroke="#00d2ff" stroke-width="1.5" />
          <rect x="0" y="0" width="265" height="74" rx="16" fill="rgba(10, 16, 32, 0.7)" />
          
          <!-- Icon Circle -->
          <rect x="14" y="15" width="44" height="44" rx="12" fill="rgba(0, 210, 255, 0.2)" stroke="rgba(0, 210, 255, 0.5)" stroke-width="1" />
          <text x="24" y="42" font-size="22">🖥️</text>
          
          <!-- Text Labels -->
          <text x="68" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">DOWNLOAD PC</text>
          <text x="68" y="49" fill="#00d2ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Windows Portable v1.0.0</text>
          
          <!-- Download Arrow Badge -->
          <g class="download-arrow" transform="translate(225, 26)">
            <circle cx="12" cy="12" r="14" fill="#00d2ff" filter="url(#button-glow)" />
            <path d="M 8,10 L 12,14 L 16,10 M 12,6 L 12,14 M 7,17 L 17,17" stroke="#05070e" stroke-width="2" stroke-linecap="round" fill="none" />
          </g>
        </g>
      </a>

      <!-- 📺 CLICKABLE TV DOWNLOAD CARD -->
      <a xlink:href="https://github.com/hemansubedi10/heman-vibes/releases/download/v1.0.0/HeMan-Vibes-TV-v1.0.0.zip" target="_blank" class="clickable-card" transform="translate(285, 0)">
        <g>
          <!-- Card Body -->
          <rect x="0" y="0" width="265" height="74" rx="16" fill="url(#btn-tv-grad)" stroke="#818cf8" stroke-width="1.5" />
          <rect x="0" y="0" width="265" height="74" rx="16" fill="rgba(10, 16, 32, 0.7)" />
          
          <!-- Icon Circle -->
          <rect x="14" y="15" width="44" height="44" rx="12" fill="rgba(129, 140, 248, 0.2)" stroke="rgba(129, 140, 248, 0.5)" stroke-width="1" />
          <text x="24" y="42" font-size="22">📺</text>
          
          <!-- Text Labels -->
          <text x="68" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">DOWNLOAD TV</text>
          <text x="68" y="49" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Android TV • Firestick • Tizen</text>
          
          <!-- Download Arrow Badge -->
          <g class="download-arrow" transform="translate(225, 26)">
            <circle cx="12" cy="12" r="14" fill="#818cf8" filter="url(#button-glow)" />
            <path d="M 8,10 L 12,14 L 16,10 M 12,6 L 12,14 M 7,17 L 17,17" stroke="#05070e" stroke-width="2" stroke-linecap="round" fill="none" />
          </g>
        </g>
      </a>

    </g>

    <!-- Small Clickable Notice -->
    <text x="5" y="248" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">
      👆 Click buttons above for instant direct download • Fully verified &amp; ad-free
    </text>

  </g>
</svg>
